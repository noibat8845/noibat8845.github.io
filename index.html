
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightning God Ant</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
            cursor: pointer;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>

<body>

    <img src="LTA.jpg" alt="Lightning God Ant">

    <audio id="thunder" loop preload="auto">
        <source src="thunder-sound-effect-made-with-Voicemod.mp3" type="audio/mpeg">
    </audio>

    <script>
        const thunder = document.getElementById("thunder");

        async function startThunder() {
            try {
                await thunder.play();
                thunder.loop = true;
            } catch (error) {
                console.error("Audio playback failed:", error);
            }
        }

        document.addEventListener("click", startThunder, { once: true });
    </script>

</body>
</html>
