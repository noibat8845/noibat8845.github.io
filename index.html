
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LightningGodAnt ⚡</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
            cursor: pointer;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>

<body>

    <img src="LTA.jpg" alt="LightningGodAnt">

    <audio id="thunder" loop preload="auto">
        <source src="thunder-sound-effect-made-with-Voicemod.mp3" type="audio/mpeg">
    </audio>

    <script>
        const thunder = document.getElementById("thunder");

        document.addEventListener("click", function startThunder() {
            thunder.play();
            document.removeEventListener("click", startThunder);
        });
    </script>

</body>
</html>
